                     سال  هشتاد و دو  شماره  23764&lt;&#x2F;td&gt;
                &lt;tr&gt;
                    &lt;td colspan=4 style=&quot;line-height:2rem; &quot;&gt;&lt;br&gt;&lt;center&gt;رأي شماره 1067561 هيئت عمومي ديوان عدالت اداري با موضوع: بخشنامه شماره 36&#x2F;1401&#x2F;200 مورخ 1401&#x2F;7&#x2F;4 رئيس كل سازمان امور مالياتي كشور با موضوع عدم مشموليت اشخاص موضوع ماده 2 قانون ماليات هاي مستقيم نسبت به ماليات موضوع بند (خ) تبصره 6 ماده واحده قانون بودجه سال 1400 كل كشور بدليل خروج از حدود اختيارات مرجع وضع كننده آن از تاريخ تصويب ابطال شد&lt;&#x2F;center&gt;&lt;&#x2F;td&gt;
              &lt;&#x2F;tr&gt; 
            &lt;tr&gt;
                &lt;td colspan=4&gt;&lt;br&gt;&lt;br&gt;
                    &lt;div style=&quot;direction:rtl&quot;&gt; &lt;p style=&quot;text-align:justify;&quot;&gt;شماره0400554&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; 1405&#x2F;5&#x2F;10&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:center;&quot;&gt;بسمه تعالي&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;مديرعامل محترم روزنامه رسمي جمهوري اسلامي ايران&lt;&#x2F;strong&gt;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;یک نسخه از رأی هیئت عمومی دیوان عدالت اداری با شماره دادنامه&amp;nbsp;140531390001067561 مورخ 1405&#x2F;4&#x2F;30 مبنی بر: بخشنامه شماره 36&#x2F;1401&#x2F;200 مورخ 1401&#x2F;7&#x2F;4 رئیس کل سازمان امور مالیاتی کشور با موضوع عدم مشمولیت اشخاص موضوع ماده 2 قانون مالیات های مستقیم نسبت به مالیات موضوع بند (خ) تبصره 6 ماده واحده قانون بودجه سال 1400 کل کشور بدلیل خروج از حدود اختیارات مرجع&amp;nbsp;وضع كننده آن از تاریخ تصویب ابطال شد. جهت درج در روزنامه رسمی به پیوست ارسال مي    گردد.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:left;&quot;&gt;مديركل هیئت عمومي و هیئت هاي تخصصي ديوان عدالت اداري ـ يداله اسمعيلي فرد&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&amp;nbsp;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;تاریخ دادنامه:&amp;nbsp;1405&#x2F;4&#x2F;30&amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp; &amp;nbsp;&lt;strong&gt;شماره دادنامه: 140531390001067561&lt;&#x2F;strong&gt;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;شماره پرونده:&amp;nbsp;0400554&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;مرجع رسیدگی:&lt;&#x2F;strong&gt; هیئت عمومی دیوان عدالت اداری&amp;nbsp;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;شاکی:&lt;&#x2F;strong&gt; خانم مهتاب سلیمانی فر&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;طرف شکایت:&lt;&#x2F;strong&gt; سازمان امور مالیاتی کشور&amp;nbsp;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;موضوع شکایت و خواسته:&lt;&#x2F;strong&gt; ابطال بخشنامه شماره&amp;nbsp;200&#x2F;1401&#x2F;36 مورخ&amp;nbsp;1401&#x2F;7&#x2F;4 رئیس کل سازمان امور مالیاتی کشور&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&lt;strong&gt;گردش کار:&lt;&#x2F;strong&gt; شاکی به موجب دادخواستی ابطال بخشنامه شماره&amp;nbsp;200&#x2F;1401&#x2F;36 مورخ&amp;nbsp;1401&#x2F;7&#x2F;4 رئیس کل سازمان امور مالیاتی کشور را خواستار شده و در جهت تبیین خواسته به طور خلاصه اعلام کرده است که:&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;“طبق بند (خ) تبصره 6 قانون بودجه سال 1400، واحدهای مسکونی و باغ ویلاهای گران قیمت مشمول مالیات بر&amp;nbsp;دارایی (سالانه) مي    باشند. آيين نامه اجرایی این بند توسط وزارت اقتصادی و دارایی (سازمان امور مالیاتی کشور) حداکثر تا پایان خرداد ماه سال 1400 تهیه مي    شود و به تصویب هیئت وزیران مي    رسد.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;بر اساس جزء (4) بند (خ) تبصره (6) قانون بودجه سال 1400، کلّیه اشخاص حقیقی و حقوقی مکلّفند مالیات سالانه مربوط به هر یک از واحد های مسکونی و باغ ویلاهای تحت تکفّل را حداکثر تا پایان بهمن ماه سال 1400 پرداخت نمایند و در این میان قانونگذار تفاوت و استثنایی بین اشخاص حقوقی خصوصی، عمومی و دولتی قائل نشده و تفکیکی در خصوص شمول یا عدم شمول مالیات اشخاص حقیقی، حقوقی، دولتی و خصوصی مشمول حکم مزبور در قانون بودجه صورت نگرفته است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;از طرفی در صدر ماده (2) قانون مالیات های مستقیم تأکید گردیده، اشخاص موضوع این ماده صرفاً از لحاظ مالیات های موضوع این قانون که در باب دوم و سوم آن پیش  بینی شده است، مشمول پرداخت مالیات نمی باشند و بر اساس مفاد باب دوم قانون مالیات های مستقیم که در خصوص پایه مالیات بر دارایی توسط قانونگذار تصویب گردیده، انواع مالیات بر دارایی طبق فصول اول لغایت پنجم این باب به ترتیب شامل مالیات سالانه املاک، مالیات بر مستغلات مسکونی خالی، مالیات بر اراضی بایر، مالیات بر ارث و حق تمبر مي    باشد و فصول اول، دوم و سوم باب دوم قانون در اصلاحیه سال 1380 قانون مالیات های مستقیم حذف گردیده است و لذا&amp;nbsp;در سال 1400&amp;nbsp;قابلیت استناد قانونی را نداشته و چنانچه&amp;nbsp;مدّ نظر قانونگذار از&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&amp;nbsp;مالیات موضوع بند (خ) تبصره (6) قانون بودجه سال 1400 همان مالیات های موضوع باب دوم قانون مالیات های مستقیم بود، باید صراحتاً در قانون بودجه به این موضوع و ارتباط اشاره مي    نمود و اگر اراده قانونگذار در احیا و پیش  بینی مجدّد مالیات سالانه املاک بوده که در اصلاحیه سال 1380 قانون مالیات های مستقیم حذف گردیده باید تصریحاً امر در قانون بودجه قید می گردید، لذا بر اساس صدر ماده (2) قانون مالیات های مستقیم، اشخاص موضوع ماده اخیرالذکر، صرفاً و صراحتاً در خصوص منابع مالیات بر دارایی موضوع قانون مالیات های مستقیم مشمول پرداخت مالیات نیستند و این امر در صدر ماده (2) قانون مالیات های مستقیم از طرف قانونگذار با درج عبارت «مشمول پرداخت مالیات های موضوع این قانون نیستند» کاملاً به وضوح بیان و تأکید و پیش  بینی گردیده است و بنابراین سایر منابع مالیات بر دارایی مندرج در سایر قوانین از جمله مالیات بر واحد های مسکونی و باغ ویلاهای گران قیمت (موضوع بند (خ) تبصره (6) قانون بودجه سال 1400)، نمی تواند در زمره مالیات بر دارایی موضوع باب دوم قانون مالیات های مستقیم تلقّی گردد. لذا اگرچه در صدر بند مزبور حکم قانون بودجه، این نوع مالیات را نوعی مالیات بر دارایی قلمداد نموده است، لیکن به جهت متفاوت بودن ماهیت آن و نیز منشاء تصویب قانون، مالیات بر دارایی قابل مطالبه به موجب بند (خ) تبصره (6) قانون بودجه سال 1400 متفاوت و منصرف از مالیات بر دارایی موضوع باب دوم قانون مالیات های مستقیم مي    باشد، زیرا چنانچه منظور قانونگذار از مالیات بر واحدهای مسکونی و باغ ویلاهای گران قیمت (موضوع بند (خ) تبصره (6) قانون بودجه سال 1400) همان مالیات سالانه املاک موضوع فصل اول باب دوم قانون مالیات های مستقیم باشد، صراحتاً توسط قانونگذار با بیان آن در قانون بودجه مشخص مي    گردید.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;حال آن که سازمان امور مالیاتی کشور طبق بخشنامه شماره&amp;nbsp;200&#x2F;1401&#x2F;36 مورخ&amp;nbsp;1401&#x2F;7&#x2F;4 و با استناد به مواد (12،10) آيين نامه اجرایی شماره 73974&#x2F;ت 58792هـ مورخ&amp;nbsp;1400&#x2F;7&#x2F;14 مصوّب هیئت وزیران با توسعه دایره شمول قانون، مالیات بر واحدهای مسکونی و باغ ویلاهای گران قیمت (موضوع بند (خ) تبصره (6) قانون بودجه سال 1400) را صرفاً با این استدلال که نوعی مالیات بر دارایی بوده، در زمره مالیات بر دارایی موضوع باب دوم قانون مالیات های مستقیم تلقّی و بر اساس تفسیر اشتباه و خلاف قانون خود، اشخاص موضوع ماده (2) قانون مالیات های مستقیم را از شمول مالیات بر واحدهای مسکونی و باغ ویلاهای گران قیمت که در قانون بودجه سالانه به عنوان مالیات بر دارایی پیش  بینی گردیده خارج نموده است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;بخشنامه های صادره سازمان امور مالیاتی باید در طریق بیان و توضیح بهتر برای اجرای قانون باشد بدون این که دایره قانون را توسعه دهد یا تضییق نماید و یا از محدوده تعیین شده آن قانون تجاوز کند، حال آن که این بخشنامه در صدد خروج اشخاص موضوع ماده (2) قانون مالیات های مستقیم از حکم مندرج در قانون بودجه بوده و مخالف نصّ قانون بودجه در خصوص عدم اعمال معافیت نسبت به اشخاص موضوع ماده (2) نسبت به مالیات پیش  بینی شده در قانون بودجه است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;اساساً این پایه مالیاتی، مالیات سالانه املاک نبوده، زیرا در قوانین بودجه سال های بعد (1401 لغایت 1404) قانونگذار علی رغم پیش  بینی حکم مزبور در این قوانین راجع به مطالبه مالیات از زمین ها، واحدها و باغ ویلا های گران قیمت، مالیات مزبور را مالیات سالانه املاک قلمداد ننموده است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;طبق اصول 71، 58، 57 قانون اساسی جمهوری اسلامی ایران و رعایت اصل تفکیک قوا وضع قانون و قواعد آمره موجب حق و تکلیف و سالب حق و تکلیف و الزامات اشخاص در عموم مسائل به قوه مقنّنه و یا مأذون از قبل قانونگذار اختصاص دارد و مصوبات و آيين نامه های دولت نمی توانند در برابر مفاد قانون تجاوز کنند به این دلیل در بخشنامه مورد اشاره بر خلاف اختیار قانونی از بند (خ) تبصره (6) قانون بودجه سال 1400 کل کشور)، دامنه قانون مخالف اختیار قانونی توسعه داده شده است که تصمیم ابطال مصوبه فاقد اعتبار قانونی از زمان تصویب توسط هیئت عمومی دیوان عدالت اداری شایسته اتّخاذ تصمیم قضایی مي    باشد.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;بخشنامه و آيين نامه مفسّر و مبیّن زوایای مبهم و تاریک و مُجمل قانونی بوده و امکان توسیع یا تضییق حدود و ثغور قانون را نداشته و نمی تواند ایجاد قاعده نماید و چنان که مخالف با نظر مقنّن و اهداف عالیه قانونگذار باشد فاقد وجاهت و اعتبار قانونی مي    باشد.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;وفق اصل سلسله مراتب قواعد حقوقی قواعد مادون مثل بخشنامه نمی تواند بدون مجوّز از قواعد مافوق خود مثل قانون عادی و اساسی از جهت حوزه و حیطه شمول دایره قانون محدود و یا آن را توسعه و یا نقض کند؛ بنابراین بخشنامه مورد اشاره، نباید مغایر با قانون اساسی و عادی باشد ضمناً بخشنامه نباید معافیت یا عدم شمول مالیات جدیدی علاوه بر معافیت های پیش  بینی شده مندرج در قانون برای سازمان ها و ادارات دولتی ایجاد نماید.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;لذا نظر به این که اگرچه بر اساس قانون بودجه سال 1400، مالیات بر واحدهای مسکونی و باغ ویلاهای گران قیمت نوعی مالیات بر دارایی (مالیات سالانه املاک) پیش  بینی گردیده، لیکن از آنجایی که ماهیت مالیات بر دارایی مندرج در قانون بودجه با انواع مالیات بر دارایی طبق باب دوم قانون مالیات های مستقیم متفاوت بوده و قانونگذار نیز اشخاص موضوع ماده (2) قانون مالیات های مستقیم را تصریحاً و صرفاً از بابت مالیات های موضوع قانون مالیات های مستقیم، مشمول پرداخت مالیات ندانسته است و در صدر ماده (2) تأکید شده که اشخاص زیر مشمول پرداخت مالیات های موضوع این قانون نیستند و منظور از این قانون نیز، قانون مالیات های مستقیم بوده است. لذا نظر به اصول 173، 170 قانون اساسی جمهوری اسلامی ایران و مستنداً به مواد 88، 80، 13، 12 قانون دیوان عدالت اداری درخواست ابطال بخشنامه فوق الذکر را استدعا دارم.&quot;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;متن مقرره مورد شکایت به شرح زیر است:&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;“بخشنامه شماره&amp;nbsp;200&#x2F;1401&#x2F;36 مورخ&amp;nbsp;1401&#x2F;7&#x2F;4 سازمان امور مالیاتی کشور&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;موضوع: عدم مشمولیت اشخاص موضوع ماده 2 قانون مالیات های مستقیم نسبت به مالیات موضوع بند (خ) تبصره 6 ماده واحده قانون بودجه سال 1400 کل کشور&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;با عنایت به این که در صدر بند (خ) تبصره 6 قانون بودجه سال 1400 کل کشور به صراحت مالیات موصوف را «مالیات بر دارایی سالانه» اعلام و معرفی نموده و مالیات مزبور جزو احکام مالیاتی باب دوم قانون مالیات های مستقیم محسوب مي    گردد و مضافاً آن که در آيين نامه اجرایی مربوطه (از جمله مواد 12، 10) مقرّرات قانون مالیات های مستقیم حاکم شده است، بنابراین با اتّخاذ ملاک از مفاد حکم ماده 2 قانون مالیات های مستقیم، کلّیه اشخاص موضوع ماده مزبور از شمول پرداخت مالیات بند (خ) تبصره یادشده خارج مي    باشند.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;رئیس کل سازمان امور مالیاتی کشور”&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;در پاسخ به شکایت مذکور، مدیر کل دفتر حقوقی و قرارداد های مالیاتی سازمان امور مالیاتی کشور به موجب لایحه شماره 10837&#x2F;212&#x2F;ص&amp;nbsp;مورخ&amp;nbsp;1404&#x2F;6&#x2F;24 توضیحاتی داده که خلاصه مفاد آن به شرح زیر است:&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;“طبق ماده 2 قانون مالیات های مستقیم، وزارتخانه ها و مؤسّسات دولتی؛ دستگاه هایی که بودجه آنها به وسیله دولت تأمین مي    شود؛ شهرداری ها و دهیاری ها و بنیاد ها و نهاد های انقلاب اسلامی دارای مجوّز معافیت از طرف حضرت امام خمینی (ره) و مقام معظّم رهبری، مشمول پرداخت مالیات نمی باشند. این در حالی است که، در باب دوم قانون یادشده با عنوان «مالیات بر دارایی»، پیشتر فصلی با عنوان «مالیات سالانه املاک”پیش بینی شده بود که مواد آن به موجب ماده 2 قانون اصلاح موادی از قانون مالیات های مستقیم مصوّب&amp;nbsp;1380&#x2F;11&#x2F;27، از ابتدای سال 1381 حذف گردیده است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;در بند (خ) تبصره 6 قانون بودجه سال 1400 کل کشور، به صراحت قید شده که در سال مربوطه، واحدهای مسکونی و باغ ویلاهای گران قیمت به شرح بندهای موضوع این بند مشمول مالیات بر دارایی (سالانه) مي    شوند. لذا مالیات مزبور جزو احکام مالیاتی باب دوم قانون مالیات های مستقیم محسوب می گردد و قانونگذار با هدف احیای مالیات سالانه املاک (سابق)، احکام بند (خ) تبصره مورد اشاره را وضع نموده است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;مضافاً آن که در آيين نامه اجرایی بند (خ) تبصره 6 قانون بودجه سال 1400 کل کشور مصوّب&amp;nbsp;1400&#x2F;7&#x2F;7، از جمله مواد 12، 11، 10 مقرّرات قانون مالیات های مستقیم حاکم گردیده است. بنابراین، با اتّخاذ ملاک از مفاد ماده 2 قانون مالیات های مستقیم، کلّیه اشخاص موضوع ماده مزبور از شمول پرداخت مالیات بند (خ) تبصره یادشده خارج شده اند.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;با این وصف نظر به معروضات و مستندات ارائه شده، رد شکایت شاکی مورد استدعا است.&quot;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;هیئت عمومی دیوان عدالت اداری در تاریخ&amp;nbsp;1405&#x2F;4&#x2F;30 با حضور رئیس و معاونین دیوان عدالت اداری و رؤسا و مستشاران شعب دیوان تشکیل شد و پس از بحث و بررسی با اکثریت آراء به شرح زیر به صدور رأی مبادرت کرده است.&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;&amp;nbsp;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:center;&quot;&gt;&lt;strong&gt;رأی هیئت عمومي&lt;&#x2F;strong&gt;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:justify;&quot;&gt;براساس اصل پنجاه و یکم قانون اساسی جمهوری اسلامی ایران: «هیچ نوع مالیات وضع نمی شود مگر به موجب قانون. موارد معافیت و بخشودگی و تخفیف مالیاتی به موجب قانون مشخص می شود.» با توجه به حکم قانونی فوق، اصل صلاحیت سازمان امور مالیاتی درخصوص این که موضوع مانحنٌ فیه را مشمول ماده 2 قانون مالیات های مستقیم تشخیص و املاک متعلّق به چهار گروه مندرج در متن ماده مزبور را از شمول مالیات بر خانه و املاک گران قیمت خارج نموده، واجد ایراد بوده و با عنایت به این که اعطای معافیت از شمول مالیات باید به موجب قانون باشد و رئیس سازمان امور مالیاتی اختیار و صلاحیتی جهت صدور بخشنامه مورد شکایت و انطباق موضوع مذکور در قانون بودجه بر مفاد قانون مالیات های مستقیم نداشته است، بنابراین بخشنامه مورد اعتراض خارج از اختیار بوده و مستند به بند یک ماده 12 و مواد 13 و 88 قانون دیوان عدالت اداری مصوّب سال 1392 از تاریخ صدور ابطال می شود. این رأی براساس ماده 93 قانون دیوان عدالت اداری (اصلاحی مصوّب&amp;nbsp;1402&#x2F;2&#x2F;10) در رسیدگی و تصمیم گیری مراجع قضایی و اداری معتبر و ملاک عمل است.&amp;nbsp;&amp;nbsp;&lt;&#x2F;p&gt;&lt;p style=&quot;text-align:left;&quot;&gt;رئيس هیئت عمومي ديوان عدالت اداري ـ احمدرضا عابدي&lt;&#x2F;p&gt;&lt;&#x2F;div&gt;
                &lt;&#x2F;td&gt;
            &lt;&#x2F;tr&gt;
        &lt;&#x2F;table&gt;" /></body></html>
